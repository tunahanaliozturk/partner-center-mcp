name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Without this a single red version cancels the others, hiding whether the
      # failure is version-specific.
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - name: Audit (report only, never blocks)
        run: npm audit --audit-level=moderate
        continue-on-error: true
      # Coverage rather than plain `npm test`: the thresholds in vitest.config.ts
      # only gate anything if they actually run here.
      - run: npm run test:coverage
      - run: npm run build
      # Offline: verifies data/scenarios.json against the committed doc snapshot.
      # The networked counterpart (check-docs.yml) refreshes that snapshot weekly.
      - run: npm run check-pack
      - run: npm run eval
      - run: npm run export
      # generated/ embeds package.json's version, so a release bump leaves it
      # stale unless someone re-runs export. That drifted unnoticed through
      # 0.9.0; running export above and then diffing makes it impossible to miss.
      - name: Fail if generated/ is out of date with the source
        run: git diff --exit-code -- generated/

  # The .NET server ships the same knowledge pack from the same data/ directory
  # and is published to NuGet from the same tag. Nothing here built it until
  # now, which is how it drifted eight tools behind the TypeScript one without
  # a single red build. PackTests asserts the two expose the same tools.
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build and test the .NET server
        working-directory: dotnet
        run: dotnet test PartnerCenterMcp.Tests -c Release
