name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Without this a single red version cancels the others, hiding whether the
      # failure is version-specific.
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - name: Audit (report only, never blocks)
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - run: npm test
      - run: npm run build
      - run: npm run eval
      - run: npm run export
