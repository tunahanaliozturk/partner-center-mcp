name: Doc freshness

# Weekly check that fetches every scenario/error docUrl and compares it against
# the committed doc-facts snapshot: dead/moved/replaced pages, a source-commit
# change to a field the pack depends on, and stale scenarios. On HIGH severity
# (dead link, moved/replaced page, unreadable page, or a depended-on field that
# actually changed) it opens (or updates) an issue. Staleness and a source edit
# that left every depended-on field unchanged are reported but do not open one.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build

      - id: check
        run: node scripts/check-docs.mjs
        continue-on-error: true

      - name: Open or update drift issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create doc-drift --color FBCA04 --description "Knowledge pack doc drift (high severity only)" 2>/dev/null || true
          existing=$(gh issue list --state open --label doc-drift --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file doc-report.md
          else
            gh issue create --title "📚 Documentation drift detected" --label doc-drift --body-file doc-report.md
          fi

      # An auto-opened issue that is silently closed leaves no record of what
      # happened, and reads from the outside like an unanswered report. Close it
      # explicitly, saying which run cleared it.
      - name: Close the drift issue once the check is clean
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --label doc-drift --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Resolved: the doc freshness check found no high-severity drift in [run \`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Reopening automatically if it returns."
          fi

      - name: Fail the run if high-severity drift was found
        if: steps.check.outcome == 'failure'
        run: exit 1
